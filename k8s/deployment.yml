apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-dashboard-deployment
#  namespace: weather-dashboard
  namespace: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      name: weather-dashboard-pod
      labels:
        app: weather-app
    spec:
      containers:
      - name: weather-dashboard-container
        image: suraim001/weather-dashboard:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi   
        livenessProbe:
          httpGet:
            path: /
            port: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
